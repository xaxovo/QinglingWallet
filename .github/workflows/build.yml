name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: 拉取依赖
        run: flutter pub get

      - name: 生成 Android 平台骨架
        run: flutter create --platforms=android --org com.qingling .

      - name: 设置应用名称
        run: sed -i 's/android:label="qinglingwallet"/android:label="清零记账"/' android/app/src/main/AndroidManifest.xml

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: qinglingwallet-apk
          path: build/app/outputs/flutter-apk/*.apk
